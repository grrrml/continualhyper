# Smoke for the CL baseline: 2 concepts, tiny step count — just checks the pipeline runs end-to-end
# (sequential train -> sample fresh/forgetting/final -> save hyper.pt). Learns ~nothing.
seed: 2024
resolution: 512
weight_dtype: fp32
sd_model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
output_dir: ./outputs/cl_smoke

hyper:
  rank: 4
  head_hidden: 100
  alpha_init: 1.0
  learn_alpha: true

target_modules: [attn2.to_k, attn2.to_v]

concepts:
  - {concept_id: cifc_dog, images_dir: data/CIFC/datasets/images/dog, prompt: "a photo of V1 dog"}
  - {concept_id: cifc_cat, images_dir: data/CIFC/datasets/images/cat, prompt: "a photo of V2 cat"}

training:
  steps_per_task: 30
  batch_size: 2
  lr: 1.0e-4
  grad_clip: 1.0
  log_every: 10
  num_workers: 2

infer:
  steps: 25
  guidance_scale: 7.5
  n_images: 1
