seed: 2024
resolution: 1024
weight_dtype: bf16
sd_model_id: stabilityai/stable-diffusion-xl-base-1.0
output_dir: ./outputs/probe/xl_bl_smoke
hyper:
  rank: 4
learned_tokens:
  enabled: true
  init_from_class: true
  lr: 0.001
target_modules:
- attn2.to_q
- attn2.to_k
- attn2.to_v
- attn2.to_out.0
concepts:
- concept_id: cifc_dog
  images_dir: data/CIFC/datasets/images/dog
  caption_dir: data/CIFC/datasets/caption/dog
  class_word: dog
  category: pet
  identifier: <V1>
  prompt: a photo of <V1> dog
- concept_id: cifc_duck_toy
  images_dir: data/CIFC/datasets/images/duck_toy
  caption_dir: data/CIFC/datasets/caption/duck_toy
  class_word: duck toy
  category: plushy
  identifier: <V2>
  prompt: a photo of <V2> duck toy
  eval_prefix: yellow rubber
- concept_id: cifc_cat
  images_dir: data/CIFC/datasets/images/cat
  caption_dir: data/CIFC/datasets/caption/cat
  class_word: cat
  category: pet
  identifier: <V3>
  prompt: a photo of <V3> cat
training:
  steps_per_task: 15
  batch_size: 2
  lr: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 5
  num_workers: 2
  diagnostic_freq: 0
infer:
  steps: 50
  guidance_scale: 7.5
  n_images: 1
wandb:
  enabled: false
  project: ContinualHyper
  name: xl_finetune
baseline:
  method: finetune
  lam: 0.0
  fisher_batches: 200
