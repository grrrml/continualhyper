training:
  steps_per_task: 400
  batch_size: 2
  lr: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 50
  num_workers: 2
  diagnostic_freq: 0
  box_aug_p: 0.5
  seg_dir: data/seg
  bg_dir: data/backgrounds
  box_t_min_frac: 0.5
  alpha_erode: 3
  augment: true
infer:
  steps: 50
  guidance_scale: 7.5
wandb:
  enabled: true
  project: ContinualHyper
  name: T50_regdw_b500
reg:
  # beta 5x wieksze niz w T50_regdw, bo czlon na dW jest przy tej samej wadze OKOLO 5x mniejszy
  # liczbowo (log zadania 49: reg 0.0005 na czynnikach wobec 0.0001 na dW). Przy beta=100 kotwica
  # na dW okazala sie wiec SLABSZA, nie lepsza, i zapominanie wzroslo z -0.038 na -0.167 DINO.
  # Zeby porownanie "czynniki vs dW" cokolwiek znaczylo, oba musza wiazac tak samo mocno.
  weight: 500.0
  lookahead_lr: 0.0001
  # Odleglosc od kotwicy liczona na ILOCZYNIE dW = x_L @ x_R, nie na czynnikach osobno.
  # Rozklad dW nie jest jednoznaczny: (x_L R, R^-1 x_R) to ta sama funkcja dla dowolnej
  # odwracalnej R, wiec MSE na czynnikach karze takze czysta zmiane cechowania. Sprawdzone
  # numerycznie: reparametryzacja zostawiajaca dW bez zmian przesuwa _reg_mse z 3.97 na 10.66,
  # a _reg_dw ani o cyfre. Kandydat na wytlumaczenie, czemu zadna z czterech kotwic (era, ema,
  # beta=300, ground_anchor) nie ruszyla nachylenia, a era/ema wrecz zabily plastycznosc.
  space: dw
