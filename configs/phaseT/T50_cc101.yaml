training:
  steps_per_task: 400
  batch_size: 2
  lr: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 50
  num_workers: 2
  # NOTE: the in-training diagnostic regenerates EVERY concept seen so far, so its cost is
  # O(T^2): at T=10 that is 4*55 = 220 generations, at T=50 it is 4*1275 = 5100. Kept at
  # P_paper's value for comparability -- raise it (or set 0) if wall clock is the binding
  # constraint. See the report.
  diagnostic_freq: 0   # O(T^2): przy T=50 diagnostyka to ~5100 generacji
  augment: true
infer:
  steps: 50
  guidance_scale: 7.5
wandb:
  enabled: true
  project: ContinualHyper
  name: T50_cc101
reg:
  weight: 100.0
  lookahead_lr: 0.0001
