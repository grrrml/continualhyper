# T50_cc101 -- scaling the task axis to T=50 on CustomConcept101.
#
# WHY: the paper's storage argument says the hypernetwork is O(1) in T and overtakes
# per-concept adapter storage past ~49 concepts. Every run so far stops at T=10, i.e. on
# the wrong side of that crossing. This config is P_paper's recipe run over 50 concepts.
#
# HYPERPARAMETERS: identical to configs/phaseP/P_paper.yaml (seed, resolution, model, hyper,
# task_cond, target_modules, training, infer, reg), with two deliberate differences:
#
#   1. The grounding branch is REMOVED (task_cond.ground_cond / ground_geo /
#      ground_geo_analytic / ground_gsa, and training.seg_dir / bg_dir / box_aug_p /
#      box_t_min_frac / alpha_erode). Those options are only meaningful when the segmented
#      cut-outs (data/seg/<concept_id>) and the background bank (data/backgrounds) exist,
#      and both banks were built ONLY for the ten CIFC concepts. With ground_cond on and no
#      cut-outs, train_cl.py would still install grounded attention on every attn2 layer and
#      train the grounding head, but it would never see a paste composite or a real box --
#      i.e. an untrained, always-boxless branch silently added to the parameter count. So it
#      is off, not merely unfed.
#
#   2. No caption_dir. CustomConcept101 ships images only (verified on the cluster: 634 image
#      files across the 101 directories, zero .txt). data.ConceptDataset falls back to
#      ConceptSpec.diag_prompt for every image, so each concept trains on the single fixed
#      caption below. This is a real difference from P_paper, where CIDM's per-image captions
#      give caption diversity. training.prompt_aug (EnhanceText, 27 templates) is the drop-in
#      substitute but is left OFF here to keep "same hyperparameters as P_paper" literally
#      true -- turn it on in a sibling config if caption collapse shows up.
#
# CONCEPT SELECTION (fixed and reproducible, no randomness):
#   The 101 directory names split into 16 category prefixes (the text before the first "_").
#   Concepts are emitted round-robin: pass 1 takes the alphabetically first directory of every
#   prefix (prefixes in alphabetical order), pass 2 the second, and so on, stopping at 50.
#   Pass 1 yields 16, pass 2 yields 16 (all prefixes have >= 2), pass 3 yields 13 (dish,
#   flower, jewelry are exhausted), and pass 4 contributes the first 5 in prefix order
#   (decoritems, furniture, instrument, luggage, pet) to reach exactly 50.
#   Round-robin rather than "first 50 alphabetically" for two reasons: alphabetical order
#   would cover only 9 of the 16 categories (no scenes, things, toys, transport, wearables),
#   and it would present 7 cats in a row -- a same-class run is exactly the confound a
#   continual-learning task order should not have.
#
# CLASS WORDS (derived from the directory name, never from looking at the images):
#   Take the part after the first "_", drop the trailing index digits, and use it when it
#   names the object. Split a concatenation of separate words ("actionfigure" -> "action
#   figure", "teddybear" -> "teddy bear"); keep single dictionary words whole ("houseplant",
#   "corkscrew", "backpack", "lighthouse", "sunglasses"). When the remainder is an index
#   ("dish_1") or an attribute rather than a noun ("plushie_pink"), fall back to the category
#   prefix. When the remainder names a live animal but the prefix says it is an object, keep
#   both ("plushie_cow" -> "cow plushie", "toy_bear" -> "toy bear"). Proper nouns are not
#   used as class words ("toy_pikachu1" -> "toy figure"): a trademarked character name in the
#   class word would hand the identity to the text encoder, which is precisely what the
#   adapter is supposed to carry.
#
# CATEGORY: only used for evaluation (gen_cifc.CAT_FILE has exactly pet/plushy/style).
#   Animate subjects (pet_*, person_*) -> pet; everything else -> plushy, whose prompt file
#   is generic "<TOK>, in the forest"-style object placement. No CC101 concept is a style.
#   Note that scene_* concepts fit neither prompt file well -- see the report.
#
# identifier: '' with strip_identifier: true, exactly as P_paper: task identity is carried by
# the random 128-d task key (task_cond.key_dim), not by a text token. Concepts that share a
# class word therefore share a training caption (four cats here, as dog/dog2 in P_paper) --
# that is by design, routing is by task index.
seed: 2024
resolution: 512
weight_dtype: fp32
sd_model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
output_dir: ./outputs/phaseT/T50_cc101
hyper:
  rank: 4
  head_hidden: 50
  alpha_init: 1.0
  learn_alpha: true
task_cond:
  enabled: true
  preserve_norm: false
  learn_v: false
  key_prompt: index
  key_dim: 128
token_mask_lora: true
strip_identifier: true
target_modules:
- attn2.to_q
- attn2.to_k
- attn2.to_v
- attn2.to_out.0
concepts:
