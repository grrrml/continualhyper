# Step 2b: von-Oswald reg (beta=100) + ORTHOGONALIZED LEARNED TASK EMBEDDINGS.
# Fix for the same-class collapse: raw CLIP pooled for two same-class concepts is nearly
# parallel (cos ~ 0.79 for V3 cat vs V9 cat), so the hypernet cannot separate them. A learnable
# per-task vector V_t modulates the pooled prompt (h_t = V_t * pooled, Hadamard) and the result
# is Gram-Schmidt-projected against the frozen basis of previous tasks' conditionings ->
# structurally orthogonal hyper inputs per task.
seed: 2024
resolution: 512
weight_dtype: fp32
sd_model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
output_dir: ./outputs/cl_ortho_b100

hyper:
  rank: 4
  head_hidden: 100        # UnHype internal_size
  alpha_init: 1.0
  learn_alpha: true       # LoRA is timestep-independent: one LoRA per prompt, reused every step

# Learned per-task embeddings + Gram-Schmidt orthogonalization of the hyper conditioning.
# The conditioning is CONSTANT per task (h_t = V_t * pooled(canonical prompt), one vector per
# task, as in the design sketch) -- per-prompt GS residuals are unstable for same-class concepts.
task_cond:
  enabled: true
  preserve_norm: true     # rescale the GS residual back to ||h_t|| (stable head input scale)

target_modules: [attn2.to_k, attn2.to_v]

# CL task sequence (CIDM/CIFC task10 order): each concept = one task. Training uses the SAME
# per-image captions as CIDM (caption_dir), with the class word replaced by "V<k> <class>"
# (identifier = V<k> by order). `class_word` + `category` drive the CIDM evaluation prompts.
# `prompt` is only the canonical diagnostic/sampling prompt (training uses the captions).
concepts:
  - {concept_id: cifc_dog,          images_dir: data/CIFC/datasets/images/dog,          caption_dir: data/CIFC/datasets/caption/dog,          class_word: dog,            category: pet,    prompt: "a photo of V1 dog"}
  - {concept_id: cifc_duck_toy,     images_dir: data/CIFC/datasets/images/duck_toy,     caption_dir: data/CIFC/datasets/caption/duck_toy,     class_word: "duck toy",     category: plushy, prompt: "a photo of V2 duck toy", eval_prefix: "yellow rubber"}
  - {concept_id: cifc_cat,          images_dir: data/CIFC/datasets/images/cat,          caption_dir: data/CIFC/datasets/caption/cat,          class_word: cat,            category: pet,    prompt: "a photo of V3 cat"}
  - {concept_id: cifc_backpack,     images_dir: data/CIFC/datasets/images/backpack,     caption_dir: data/CIFC/datasets/caption/backpack,     class_word: backpack,       category: plushy, prompt: "a photo of V4 backpack", eval_prefix: "red"}
  - {concept_id: cifc_teddybear,    images_dir: data/CIFC/datasets/images/teddybear,    caption_dir: data/CIFC/datasets/caption/teddybear,    class_word: "teddy bear",   category: plushy, prompt: "a photo of V5 teddy bear"}
  - {concept_id: cifc_painting,     images_dir: data/CIFC/datasets/images/painting,     caption_dir: data/CIFC/datasets/caption/painting,     class_word: painting,       category: style,  prompt: "a photo of V6 painting"}
  - {concept_id: cifc_dog2,         images_dir: data/CIFC/datasets/images/dog2,         caption_dir: data/CIFC/datasets/caption/dog2,         class_word: dog,            category: pet,    prompt: "a photo of V7 dog"}
  - {concept_id: cifc_drawing,      images_dir: data/CIFC/datasets/images/drawing,      caption_dir: data/CIFC/datasets/caption/drawing,      class_word: drawing,        category: style,  prompt: "a photo of V8 drawing"}
  - {concept_id: cifc_cat2,         images_dir: data/CIFC/datasets/images/cat2,         caption_dir: data/CIFC/datasets/caption/cat2,         class_word: cat,            category: pet,    prompt: "a photo of V9 cat"}
  - {concept_id: cifc_ink_painting, images_dir: data/CIFC/datasets/images/ink_painting, caption_dir: data/CIFC/datasets/caption/ink_painting, class_word: "ink painting", category: style,  prompt: "a photo of V10 ink painting"}

training:
  steps_per_task: 400
  batch_size: 2
  lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 50
  num_workers: 2
  diagnostic_freq: 200       # every N steps: wandb diagnostic generations for all concepts seen so far

infer:
  steps: 50
  guidance_scale: 7.5

wandb:
  enabled: true
  project: ContinualHyper
  name: cl_ortho

# von-Oswald hypernetwork output-regularization (arXiv:1906.00695), two-stage lookahead.
reg:
  weight: 100.0          # beta at the sweep's sweet spot
  lookahead_lr: 1.0e-4   # DeltaTheta candidate-step size (default = training lr)
