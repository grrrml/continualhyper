[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continualhyper"
version = "0.1.0"
description = "A LoRA-hypernetwork for continual learning in diffusion models (UnHype ported to the CIFC/CIDM setting)."
readme = "README.md"
requires-python = ">=3.11"
# Lean, self-sufficient dependency set (diffusers-based; no CompVis ldm / pytorch-lightning
# stack). These are a subset of the shared UnHype venv, so that env can be reused as-is.
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "diffusers==0.30.0",
    "transformers==4.44.2",
    "accelerate==1.8.1",
    "safetensors==0.5.3",
    "huggingface-hub==0.36.0",
    "einops==0.8.1",
    "numpy==1.26.4",
    "pillow==11.3.0",
    "pyyaml==6.0.2",
    "tqdm==4.67.1",
    "scipy==1.16.3",
    "timm==1.0.24",
]

[tool.setuptools]
packages = ["src"]
